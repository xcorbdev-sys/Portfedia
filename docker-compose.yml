# Local development / single-server deployment:  docker compose up -d --build
# On Coolify you can deploy this file directly ("Docker Compose" build pack),
# or deploy only the Dockerfile and create MongoDB as a separate Coolify resource (recommended).
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/portfedia}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      COMPANY_NAME: ${COMPANY_NAME:-Portfedia}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Legal notice (künye): shown on /legal, /privacy and /kvkk when set
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_MERSIS: ${COMPANY_MERSIS:-}
      COMPANY_TAX: ${COMPANY_TAX:-}
      COMPANY_REGISTRY: ${COMPANY_REGISTRY:-}
      COMPANY_KEP: ${COMPANY_KEP:-}
      EU_REPRESENTATIVE: ${EU_REPRESENTATIVE:-}
      PWNED_CHECK: ${PWNED_CHECK:-}
      # Paid plans (Pro/Business, /pricing): off until set to "on"; while off every feature is free
      PAID_PLANS: ${PAID_PLANS:-}
      # Virus scanning of uploads: start with `docker compose --profile security up` and set CLAMAV_HOST=clamav
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    volumes:
      # Only used when R2 is not configured (images are stored on local disk)
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional virus scanner for uploads (#19). Needs ~1.5 GB RAM; downloads signatures on first start.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles: ["security"]

  # Optional uptime monitoring (#96): docker compose --profile monitoring up -d, then open port 3001.
  # Add an HTTP monitor for http://app:3000/api/health (see docs/OPERATIONS.md).
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma:/app/data

volumes:
  mongo-data:
  uploads:
  uptime-kuma:
